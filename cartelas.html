<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelas — Bingo Junino Fundepar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/cartelas.css">
</head>
<body>
    <header class="no-print">
        <nav class="site-nav">
            <a href="index.html">Sorteador</a>
            <a href="cartelas.html" class="active">Cartelas</a>
        </nav>
        <div class="nav-stripe"></div>
    </header>

    <div class="page-header no-print">
        <div class="logo-container">
            <img src="assets/logo_fundepar.jpg" alt="Logo FUNDEPAR">
        </div>
        <h1 class="page-title">Gerador de Cartelas</h1>
    </div>

    <main>
        <div class="controls-panel card-panel no-print">
            <div class="control-row">
                <div class="control-group">
                    <label>Rodada</label>
                    <div class="rodada-buttons" id="rodadaButtons"></div>
                </div>
                <div class="control-group">
                    <label for="qtdInput">Quantidade (máx. 500)</label>
                    <input type="number" id="qtdInput" min="1" max="500" value="500" class="ctrl-input">
                </div>
                <div class="control-actions">
                    <button class="btn btn-primary" id="generateBtn">Gerar Cartelas</button>
                    <button class="btn btn-orange" id="printBtn">🖨️ Imprimir</button>
                </div>
            </div>
            <p class="status-text" id="statusText"></p>
        </div>

        <div id="cardsContainer"></div>
    </main>

    <!-- Modal: aviso de re-geração -->
    <div class="modal" id="regenModal">
        <div class="modal-box">
            <div class="result-icon">⚠️</div>
            <h2>Cartelas já geradas!</h2>
            <p>As cartelas da <strong id="regenRodadaLabel">Rodada X</strong> já foram impressas anteriormente.</p>
            <p style="margin-top:8px;">Gerar novamente criará <strong>cartelas diferentes</strong> das já distribuídas, o que pode causar problemas na verificação de vencedores.</p>
            <p style="margin-top:8px;">Tem certeza que deseja continuar?</p>
            <div class="modal-actions">
                <button class="btn btn-danger" id="regenConfirm">Sim, gerar novas cartelas</button>
                <button class="btn btn-primary" id="regenCancel">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="js/bingo-core.js"></script>
    <script src="js/cartelas.js"></script>
</body>
</html>
