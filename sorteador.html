<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador de Bingo FUNDEPAR</title>
    <style>
        :root {
            --azure-web: #D6EBEEff;
            --zomp: #57A288ff;
            --skobeloff: #1E7670ff;
            --tiffany-blue: #A4D0CDff;
            --white: #FFFFFFff;
        }
        
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: var(--azure-web);
            color: var(--skobeloff);
        }
        
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            margin-top: 50px;
            gap: 20px;
        }
        
        .logo-container {
            width: 150px;
            height: 150px;
            background-color: var(--white);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .logo-container img {
            max-width: 90%;
            max-height: 90%;
        }
        
        h1 {
            color: var(--skobeloff);
            margin: 0;
            font-size: 2.5rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        .bingo-board {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
            margin: 20px auto;
            gap: 5px;
            background-color: var(--white);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .bingo-ball {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--tiffany-blue);
            color: var(--skobeloff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 24px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        
        .drawn {
            background-color: var(--zomp);
            color: var(--white);
            transform: scale(0.95);
        }
        
        .current-ball-container {
            margin: 30px auto;
            padding: 20px;
            background-color: var(--white);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        
        .current-ball {
            width: 200px;
            height: 200px;
            font-size: 80px;
            margin: 0 auto;
            background: linear-gradient(135deg, var(--zomp), var(--skobeloff));
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(30, 118, 112, 0.4);
        }
        
        .pulse-animation {
            animation: pulse 1s 3;
        }
    
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .letter {
            font-size: 40px;
            margin-right: 15px;
            color: var(--white);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .number {
            font-size: 100px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.2);
        }
        
        button {
            background-color: var(--skobeloff);
            color: var(--white);
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        button:hover {
            background-color: var(--zomp);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .controls {
            margin: 30px 0;
        }
        
        .ball-info {
            margin-top: 15px;
            font-size: 24px;
            color: var(--skobeloff);
            font-weight: bold;
        }
        
        .drawn-numbers {
            background-color: var(--white);
            padding: 15px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 800px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .drawn-numbers h3 {
            margin-top: 0;
            color: var(--skobeloff);
        }
        
        .drawn-numbers-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        
        .drawn-number {
            background-color: var(--tiffany-blue);
            color: var(--skobeloff);
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header style="background-color: #1E7670; padding: 10px 20px; text-align: center;">
        <nav>
            <a href="index.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Cadastro de Pedras</a>
            <a href="geradorCartelas.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Gerador de Cartelas</a>
        </nav>
    </header>

    <div class="header">
        <div class="logo-container">
            <!-- Substitua pelo caminho da sua imagem da FUNDEPAR -->
            <img src="assets/logo_fundepar.jpg" alt="Logo FUNDEPAR">
        </div>
        <h1>Bingo FUNDEPAR</h1>
    </div>
    
    <div class="controls">
        <button id="drawButton">Sortear Número</button>
        <button id="resetButton">Reiniciar</button>
    </div>
    
    <div class="current-ball-container">
        <div id="currentBall" class="current-ball" style="display: none;"></div>
        <div id="ballInfo" class="ball-info"></div>
    </div>
    
    <div class="drawn-numbers">
        <h3>Números Sorteados:</h3>
        <div id="drawnNumbersList" class="drawn-numbers-list"></div>
    </div>
    
    <div class="bingo-board" id="bingoBoard"></div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const drawButton = document.getElementById('drawButton');
            const resetButton = document.getElementById('resetButton');
            const currentBall = document.getElementById('currentBall');
            const ballInfo = document.getElementById('ballInfo');
            const bingoBoard = document.getElementById('bingoBoard');
            const drawnNumbersList = document.getElementById('drawnNumbersList');
            
            let drawnNumbers = [];
            let availableNumbers = Array.from({length: 75}, (_, i) => i + 1);
            
            // Inicializa o tabuleiro
            function initializeBoard() {
                bingoBoard.innerHTML = '';
                drawnNumbersList.innerHTML = '';
                for (let i = 1; i <= 75; i++) {
                    const ball = document.createElement('div');
                    ball.className = 'bingo-ball';
                    ball.id = `ball-${i}`;
                    ball.textContent = i;
                    bingoBoard.appendChild(ball);
                }
            }
            
            // Sorteia um número
            function drawNumber() {
                if (availableNumbers.length === 0) {
                    alert('Todos os números já foram sorteados!');
                    return;
                }
                
                const randomIndex = Math.floor(Math.random() * availableNumbers.length);
                const drawnNumber = availableNumbers[randomIndex];
                
                // Remove o número sorteado do array de disponíveis
                availableNumbers.splice(randomIndex, 1);
                drawnNumbers.push(drawnNumber);
                
                // Atualiza a interface
                updateUI(drawnNumber);
            }
            
            function updateUI(number) {
                // Remove a classe de animação se estiver presente
                currentBall.classList.remove('pulse-animation');
                
                // Força um reflow antes de adicionar a classe novamente
                void currentBall.offsetWidth;
                
                // Mostra a bola atual
                currentBall.style.display = 'flex';
                currentBall.innerHTML = `<span class="letter">${getBingoLetter(number)}</span><span class="number">${number}</span>`;
                
                // Adiciona a classe de animação
                currentBall.classList.add('pulse-animation');
                
                // Remove a classe após a animação terminar
                setTimeout(() => {
                    currentBall.classList.remove('pulse-animation');
                }, 3000);
                
                // Restante do código permanece o mesmo...
                ballInfo.textContent = `Número sorteado: ${getBingoLetter(number)}-${number}`;
                
                const ballElement = document.getElementById(`ball-${number}`);
                ballElement.classList.add('drawn');
                
                const drawnNumberElement = document.createElement('span');
                drawnNumberElement.className = 'drawn-number';
                drawnNumberElement.textContent = `${getBingoLetter(number)}-${number}`;
                drawnNumbersList.appendChild(drawnNumberElement);
            }
            
            // Obtém a letra do BINGO para o número
            function getBingoLetter(number) {
                if (number <= 15) return 'B';
                if (number <= 30) return 'I';
                if (number <= 45) return 'N';
                if (number <= 60) return 'G';
                return 'O';
            }
            
            // Reinicia o jogo
            function resetGame() {
                drawnNumbers = [];
                availableNumbers = Array.from({length: 75}, (_, i) => i + 1);
                currentBall.style.display = 'none';
                ballInfo.textContent = '';
                initializeBoard();
            }
            
            // Event listeners
            drawButton.addEventListener('click', drawNumber);
            resetButton.addEventListener('click', resetGame);
            
            // Inicializa o jogo
            initializeBoard();
        });
    </script>
</body>
</html>
