<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador — Bingo Junino Fundepar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/sorteador.css">
</head>
<body>
    <header>
        <nav class="site-nav">
            <a href="index.html" class="active">Sorteador</a>
            <a href="cartelas.html">Cartelas</a>
        </nav>
        <div class="nav-stripe"></div>
    </header>

    <div class="page-header">
        <div class="logo-container">
            <img src="assets/logo_fundepar.jpg" alt="Logo FUNDEPAR">
        </div>
        <h1 class="page-title">Bingo Junino Fundepar</h1>
    </div>

    <main class="sorteador-main">

        <!-- Banner somente leitura (oculto por padrão) -->
        <div class="view-mode-banner" id="viewModeBanner" style="display:none;"></div>

        <!-- Navegação por rodadas -->
        <div class="round-nav">
            <button class="btn btn-secondary btn-sm" id="prevRoundBtn" disabled>← Rodada Anterior</button>
            <span class="round-label" id="roundLabel">Rodada 1 de 10</span>
            <button class="btn btn-secondary btn-sm" id="nextRoundBtn" disabled>Rodada Seguinte →</button>
        </div>

        <!-- Botão voltar à rodada atual (oculto por padrão) -->
        <div style="text-align:center; margin-top: 8px;">
            <button class="btn btn-warning btn-sm" id="returnBtn" style="display:none;">▶ Voltar à Rodada Atual</button>
        </div>

        <!-- Bola atual -->
        <div class="current-ball-wrapper">
            <div class="current-ball idle" id="currentBall">
                <span class="ball-letter" id="ballLetter"></span>
                <span class="ball-number" id="ballNumber">?</span>
            </div>
            <p class="ball-caption" id="ballCaption">Nenhuma pedra sorteada</p>
        </div>

        <!-- Controles principais -->
        <div class="controls">
            <button class="btn btn-primary" id="drawBtn">🎲 Sortear</button>
            <button class="btn btn-secondary" id="undoBtn">↩ Desfazer</button>
            <button class="btn btn-warning" id="verifyBtn">🏆 Verificar Vencedor</button>
        </div>

        <!-- Tabuleiro -->
        <div class="bingo-board-wrapper">
            <div class="bingo-board" id="bingoBoard"></div>
        </div>

        <!-- Histórico -->
        <div class="history-panel card-panel">
            <h3 class="history-title">Pedras sorteadas (em ordem)</h3>
            <div class="history-list" id="historyList"></div>
        </div>

        <!-- Encerrar rodada -->
        <div class="end-round-section">
            <button class="btn btn-danger" id="endRoundBtn">Encerrar Rodada 1 e Iniciar a Próxima ▶</button>
        </div>

        <!-- Reiniciar evento -->
        <div class="restart-section">
            <button class="btn btn-secondary btn-sm" id="restartBtn">🗑️ Reiniciar Evento do Zero</button>
        </div>

    </main>

    <!-- Modal: confirmação genérica -->
    <div class="modal" id="confirmModal">
        <div class="modal-box">
            <h2 id="confirmTitle">Confirmar?</h2>
            <p id="confirmMessage"></p>
            <div class="modal-actions">
                <button class="btn btn-primary" id="confirmOk">Confirmar</button>
                <button class="btn btn-secondary" id="confirmCancel">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal: verificar vencedor -->
    <div class="modal" id="verifyModal">
        <div class="modal-box">
            <h2>Verificar Vencedor</h2>
            <p>Digite o número da cartela (1 a 500)</p>
            <input type="number" id="verifySerial" class="modal-input" min="1" max="500" placeholder="Ex: 42">
            <div class="modal-actions">
                <button class="btn btn-primary" id="verifyOk">Verificar</button>
                <button class="btn btn-secondary" id="verifyCancel">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal: resultado -->
    <div class="modal" id="resultModal">
        <div class="modal-box">
            <div class="result-icon" id="resultIcon"></div>
            <h2 id="resultTitle"></h2>
            <p id="resultMessage"></p>
            <div class="modal-actions">
                <button class="btn btn-primary" id="resultClose">Fechar</button>
            </div>
        </div>
    </div>

    <script src="js/bingo-core.js"></script>
    <script src="js/sorteador.js"></script>
</body>
</html>
